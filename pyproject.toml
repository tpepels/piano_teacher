[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-teacher"
version = "0.1.0"
description = "Minimal MIDI phrase-practice application for Linux"
requires-python = ">=3.10"
dependencies = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]
godot = ["music21>=9.1,<10", "verovio>=5,<6"]
qt = ["PySide6>=6.6,<7"]

[project.scripts]
piano-teacher = "piano_teacher.server:main"
piano-teacher-qt = "piano_teacher.ui:main"

[tool.setuptools.packages.find]
include = ["piano_teacher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
