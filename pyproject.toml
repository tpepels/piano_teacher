[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-teacher"
version = "0.1.0"
description = "Minimal MIDI phrase-practice application for Linux"
requires-python = ">=3.11"
dependencies = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2", "music21>=9,<11", "onnxruntime==1.30.0"]

[project.optional-dependencies]
test = ["pytest>=8", "coverage>=7,<8", "PyYAML>=6,<7"]
coda-research = ["numpy>=1.26,<3"]
godot = ["verovio>=5,<6", "CairoSVG>=2.7,<3", "Pillow>=9,<13"]

[tool.setuptools.package-data]
piano_teacher = ["lesson_settings.json"]
"piano_teacher.fingering" = ["models/*.onnx", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["piano_teacher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
