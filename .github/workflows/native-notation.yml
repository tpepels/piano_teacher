name: Piano Teacher (fast contract gate)

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      revision:
        description: Commit passing quick Python contracts (not Godot or full notation)
        value: ${{ jobs.native-gate.outputs.revision }}

permissions:
  contents: read

concurrency:
  group: native-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-gate:
    name: python-contracts
    runs-on: ubuntu-latest
    # Short checks plus one complete small MusicXML semantic fixture manifest.
    # No Godot screenshot sweep, MIDI library iteration or long CI.
    timeout-minutes: 2
    outputs:
      revision: ${{ steps.passed.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install minimal Python contracts
        run: python -m pip install -e '.[test]'
      - name: Run fast source and MIDI checks
        run: bash scripts/ci-smoke.sh
      - name: Install MusicXML parser for semantic audit
        # No Godot, Verovio rasterization or complete UI dependencies.
        run: python -m pip install 'music21>=9.1,<10'
      - name: Independent supported-MusicXML semantic coverage
        # This is not a native framebuffer proof. A failed source or
        # insufficient provenance leaves a non-green status and a report.
        run: timeout 30s python scripts/audit_notation_proof.py --out "$RUNNER_TEMP/notation-semantic-current.json"
      - name: Retain current-revision semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notation-semantic-${{ github.sha }}
          path: ${{ runner.temp }}/notation-semantic-current.json
          if-no-files-found: warn
          retention-days: 7
      - name: Record quick-check revision
        id: passed
        env:
          REVISION: ${{ github.sha }}
        run: printf 'revision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"
