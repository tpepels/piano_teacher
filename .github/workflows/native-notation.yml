name: Piano Teacher (fast contract gate)

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      revision:
        description: Commit passing quick Python contracts (not Godot or full notation)
        value: ${{ jobs.native-gate.outputs.revision }}

permissions:
  contents: read

concurrency:
  group: native-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-gate:
    name: python-contracts
    runs-on: ubuntu-latest
    # Hard bound including checkout, Python setup, installation and tests.
    timeout-minutes: 2
    outputs:
      revision: ${{ steps.passed.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install minimal Python contracts
        run: python -m pip install -e '.[test]'
      - name: Run fast source and MIDI checks
        run: bash scripts/ci-smoke.sh
      - name: Record quick-check revision
        id: passed
        env:
          REVISION: ${{ github.sha }}
        run: printf 'revision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"
