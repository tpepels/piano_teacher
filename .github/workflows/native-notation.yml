name: Native notation (quick checks)

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      revision:
        description: Commit that passed fast checks (not a full notation audit)
        value: ${{ jobs.native-gate.outputs.revision }}

permissions:
  contents: read

jobs:
  native-gate:
    name: native-notation
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 12
    outputs:
      revision: ${{ steps.passed.outputs.revision }}
    steps:
      - name: Install Python and Godot
        run: pacman -Syu --noconfirm --needed base-devel pkgconf alsa-lib git python python-pip godot cairo pango
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Trust container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install application
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[godot,test]'
      - name: Run fast verification (no corpus rendering)
        run: bash scripts/verify-notation.sh --ci
      - name: Record quick-check revision
        id: passed
        env:
          REVISION: ${{ github.sha }}
        run: printf 'revision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"
