name: Phase 4 native release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-release-gate:
    name: Exact native release gate
    uses: ./.github/workflows/native-release-gate.yml
    with:
      revision: ${{ github.sha }}
