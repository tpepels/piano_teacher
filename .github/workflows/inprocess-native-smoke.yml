name: Embedded Python runtime smoke (bounded)

on:
  push:
    branches: [main]
    paths:
      - 'godot/inprocess_bus.gd'
      - 'godot/native_bridge_smoke.gd'
      - 'scripts/verify-native-bridge.sh'
      - 'run-inprocess.sh'
      - '.github/workflows/inprocess-native-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: embedded-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install ALSA headers for CPython 3.14 MIDI build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Install Python practice and score runtime (CI only)
        run: python -m pip install -e '.[godot]'
      # Reuse the verified CPython 3.14 shared library built from main.
      # When native C++ changes, the native build workflow must create a new
      # binary and perform its own smoke, rather than trusting this cache.
      - uses: actions/download-artifact@v4
        with:
          name: piano-native-linux-x86_64-py314
          run-id: 41211685754
          github-token: ${{ github.token }}
          path: .
      - name: Download Godot 4.7.2 editor
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 65 \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Verify class registration and real embedded library listing
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          PIANO_PYTHON: python
          XDG_CONFIG_HOME: ${{ runner.temp }}/piano-config
          XDG_DATA_HOME: ${{ runner.temp }}/piano-data
        run: bash scripts/verify-native-bridge.sh
