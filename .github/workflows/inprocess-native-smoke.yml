name: Embedded Python runtime smoke (bounded)

on:
  workflow_run:
    workflows: ['Embedded Python bridge (bounded build)']
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Successful native build run containing the GDExtension artifact'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: embedded-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Validate the exact implementation whose native binary was built.
          # Checkout of mutable main would make the artifact evidence ambiguous.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install ALSA headers for CPython 3.14 MIDI build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Install Python practice and score runtime (CI only)
        run: python -m pip install -e '.[godot]'
      # Load the artifact from the exact native-build run that just
      # completed. Never test stale C++ binaries against new GDScript.
      - uses: actions/download-artifact@v4
        with:
          name: piano-native-linux-x86_64-py314
          run-id: ${{ github.event.workflow_run.id || inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Download Godot 4.7.2 editor
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 65 \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Generate real two-hand MIDI for native Coda + Fukuda integration
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.smoke_phase0 import make_fixture
          target = Path.home() / "Music" / "Piano Teacher" / "phase6_native_fixture.mid"
          target.parent.mkdir(parents=True, exist_ok=True)
          make_fixture(target)
          print("NATIVE_SCORE_FIXTURE_OK", target)
          PY
      - name: Verify class registration and real embedded score workflow
        env:
          PIANO_NATIVE_REAL_SCORE_SMOKE: "1"
          PIANO_NATIVE_BRIDGE_TIMEOUT_SECONDS: "125"
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          PIANO_PYTHON: python
          XDG_CONFIG_HOME: ${{ runner.temp }}/piano-config
          XDG_DATA_HOME: ${{ runner.temp }}/piano-data
        run: bash scripts/verify-native-bridge.sh
      - name: Exercise actual production practice scene with embedded real MIDI
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          PIANO_PYTHON: python
          XDG_CONFIG_HOME: ${{ runner.temp }}/piano-config-ui
          XDG_DATA_HOME: ${{ runner.temp }}/piano-data-ui
        run: |
          python - <<'PY'
          from piano_teacher.library import ScoreLibrary
          library = ScoreLibrary()
          library.mark_opened("phase6_native_fixture.mid")
          library.update(fullscreen=False)
          print("PHASE6_LAST_PIECE_SEEDED",library.settings["last_piece"])
          PY
          PY_SITE="$(python -c 'import site; print(site.getsitepackages()[0])')"
          PY_BASE="$(python -c 'import sys; print(sys.base_prefix)')"
          PY_LIB="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          export PIANO_TEACHER_PYTHON_HOME="$PY_BASE"
          export PYTHONPATH="$PWD:$PY_SITE"
          export LD_LIBRARY_PATH="$PY_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          timeout 105s "$GODOT_BIN" --headless --audio-driver Dummy --path godot \
            --script res://production_ui_smoke.gd
      - name: Exercise production session with real Moonlight Sonata MIDI
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          XDG_CONFIG_HOME: ${{ runner.temp }}/piano-real-score-config
          XDG_DATA_HOME: ${{ runner.temp }}/piano-real-score-data
        run: |
          mkdir -p "$HOME/Music/Piano Teacher"
          cp midi/Moonlight_Sonata_I.midi "$HOME/Music/Piano Teacher/"
          python - <<'PY'
          from piano_teacher.library import ScoreLibrary
          library=ScoreLibrary()
          library.mark_opened("Moonlight_Sonata_I.midi")
          library.update(fullscreen=False,exercise_strategy="coda-fukuda-midi")
          print("PHASE6_REAL_MIDI_PREPARED",library.settings["last_piece"])
          PY
          export PIANO_TEACHER_PYTHON_HOME="$(python -c 'import sys; print(sys.base_prefix)')"
          PY_SITE="$(python -c 'import site; print(site.getsitepackages()[0])')"
          PY_LIB="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR") or "")')"
          export PYTHONPATH="$PWD:$PY_SITE"
          export LD_LIBRARY_PATH="$PY_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          timeout 145s "$GODOT_BIN" --headless --audio-driver Dummy --path godot \
            --script res://production_session_journey.gd
      - name: Audit assembled standalone runtime imports and native assets
        env:
          PIANO_GODOT_BINARY: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          PIANO_PACKAGE_AUDIT_ONLY: "1"
        run: |
          export PIANO_BUNDLED_PYTHON_HOME="$(python -c 'import sys; print(sys.prefix)')"
          export PIANO_BUNDLED_NODE="$(command -v node)"
          timeout 100s bash scripts/package-inprocess.sh
          test -s dist/piano-teacher-linux-x86_64/godot/native/bin/libpiano_bridge.linux.template_release.x86_64.so
          test -x dist/piano-teacher-linux-x86_64/PianoTeacher
