name: Coda research contracts (bounded)

# Independent of the desktop/MIDI-only fast gate. Do not run Godot or
# the long notation corpus. Tests are limited to source and timeline contracts.
on:
  push:
    paths:
      - 'piano_teacher/research/coda_*.py'
      - 'tests/test_coda_author_catalog.py'
      - 'piano_teacher/application/coda_midi_curriculum.py'
      - 'piano_teacher/exercise_strategies.py'
      - 'piano_teacher/learning.py'
      - 'piano_teacher/lesson_generators.py'
      - 'piano_teacher/lesson_source_planner.py'
      - 'tests/test_lesson_generator_architecture.py'
      - 'piano_teacher/notation/lesson.py'
      - 'piano_teacher/notation/source_annotations.py'
      - 'tests/test_coda_*.py'
      - 'scripts/evaluate_coda_pedagogy.py'
      - 'scripts/audit_coda_live_notes.py'
      - 'tests/fixtures/research/*.musicxml'
      - 'tests/fixtures/musical_fidelity/xml_parallel_tied_voices.musicxml'
      - '.github/workflows/coda-research-contract-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coda-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded Coda research contracts
        run: python -m pip install -e '.[test,coda-research]'
      - name: Compile Coda projection
        run: |
          python -m compileall -q piano_teacher/research tests/test_coda_*.py
      - name: Coda source, notation and sounding attack contracts
        run: |
          timeout 45s python -m pytest -q --tb=short \
            tests/test_coda_matrix_research.py \
            tests/test_coda_notation_hierarchy.py \
            tests/test_coda_reference_exercises.py \
            tests/test_coda_reference_matrix.py \
            tests/test_coda_research_strategies.py \
            tests/test_coda_score_projection.py \
            tests/test_coda_source_connectors.py \
            tests/test_coda_source_metadata.py \
            tests/test_coda_written_rests_research.py \
            tests/test_coda_written_tie_segments.py \
            tests/test_coda_four_family_contract.py \
            tests/test_coda_timeline_end_to_end.py \
            tests/test_coda_differential.py \
            tests/test_coda_discrepancy.py \
            tests/test_coda_parity_contract.py \
            tests/test_coda_midi_grid.py \
            tests/test_coda_midi_corpus.py \
            tests/test_coda_midi_passage.py \
            tests/test_coda_midi_long_repertoire.py \
            tests/test_coda_auto_chord_levels.py \
            tests/test_coda_author_catalog.py \
            tests/test_coda_extended_probe.py \
            tests/test_coda_piece_curriculum.py \
            tests/test_coda_midi_author_catalog_completeness.py \
            tests/test_lesson_generator_architecture.py \
            tests/test_coda_live_note_audit.py \
            tests/test_coda_pedagogy_pilot.py

      - name: Sparse Coda matches dense reference and handles every bundled real MIDI file
        run: |
          timeout 65s python -m pytest -q --tb=short \
            tests/test_coda_midi_sparse.py

      - name: Audit every production Coda stage over independent MIDI corpus
        run: |
          timeout 20s python -m scripts.audit_coda_live_notes \
            --output "$RUNNER_TEMP/coda-live-note-audit.json"
      - name: Retain complete source attack and grading clock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coda-live-note-audit-${{ github.sha }}
          path: ${{ runner.temp }}/coda-live-note-audit.json
          if-no-files-found: warn
          retention-days: 14
