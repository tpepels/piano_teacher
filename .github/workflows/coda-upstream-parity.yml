name: Coda author reference differential smoke

# Explicit only (except workflow edits); no long-running CI corpus.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/coda-upstream-parity.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies and syntax
        run: |
          python -m pip install -e '.[test,coda-research]' 'music21>=9.1,<10'
          python -m compileall -q scripts/compare_coda_upstream.py scripts/probe_coda_upstream_edges.py scripts/probe_coda_upstream_scores.py piano_teacher/research/coda_differential.py piano_teacher/research/coda_discrepancy.py
      - name: Pure written/sounding and discrepancy contracts
        run: timeout 20s python -m pytest -q --tb=short tests/test_coda_differential.py tests/test_coda_discrepancy.py
      - name: Checkout exactly published author backend SHA
        run: |
          git clone -q --depth 1 https://github.com/annieetang/coda_backend.git "$RUNNER_TEMP/upstream"
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = 'a4eb85dfc2bd418818ca9ff775c0a11ccccb3530'
      - name: Real author code versus current MMR and generated notes
        id: proof
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/coda-diff"
          echo "${{ github.sha }}" > "$RUNNER_TEMP/coda-diff/our-revision.txt"
          timeout 95s python scripts/compare_coda_upstream.py \
            --upstream "$RUNNER_TEMP/upstream" \
            --report "$RUNNER_TEMP/coda-diff/report.json" \
            > "$RUNNER_TEMP/coda-diff/output.txt" 2>&1 || {
              cat "$RUNNER_TEMP/coda-diff/output.txt"
              exit 1
            }
          cat "$RUNNER_TEMP/coda-diff/report.json"
      - name: Compare mixed durations and record known/unknown divergences
        id: edges
        continue-on-error: true
        run: |
          timeout 70s python scripts/probe_coda_upstream_edges.py \
            --upstream "$RUNNER_TEMP/upstream" \
            --report "$RUNNER_TEMP/coda-diff/edge-cases.json" \
            > "$RUNNER_TEMP/coda-diff/edge-output.txt" 2>&1 || {
              cat "$RUNNER_TEMP/coda-diff/edge-output.txt"
              exit 1
            }
          cat "$RUNNER_TEMP/coda-diff/edge-output.txt"
      - name: Diagnose six source scores with complete written/sounding counterexamples
        id: scores
        continue-on-error: true
        run: |
          timeout 60s python scripts/probe_coda_upstream_scores.py \
            --upstream "$RUNNER_TEMP/upstream" \
            --report "$RUNNER_TEMP/coda-diff/real-source-voices.json" \
            > "$RUNNER_TEMP/coda-diff/real-source-output.txt" 2>&1 || {
              cat "$RUNNER_TEMP/coda-diff/real-source-output.txt"
              exit 1
            }
          cat "$RUNNER_TEMP/coda-diff/real-source-output.txt"
          python - "$RUNNER_TEMP/coda-diff/real-source-voices.json" <<'PY'
          import json,sys
          from collections import Counter
          result=json.load(open(sys.argv[1]))
          assert result["algorithm_total"]==60
          assert result["algorithm_exceptions"]==0
          assert result["algorithm_upstream_none"]==4
          assert result["diagnosed_cases"]==26
          assert result["unclassified_cases"]==0
          assert result["reference_mmr_exact_voices"]==12
          assert result["algorithm_sounding_exact"]==40
          assert result["algorithm_sounding_different"]==15
          assert result["algorithm_sounding_invalid_ties"]==1
          assert result["algorithm_written_exact"]==30
          assert result["algorithm_written_different"]==26
          assert result["algorithm_written_unavailable"]==4
          assert sum(result["discrepancy_categories"].values())==26
          for sample in result["cases"]:
              for voice in sample["voices"]:
                  for operation,outcome in voice.get("algorithms",{}).items():
                      if "diagnosis" not in outcome:
                          continue
                      diagnosis=outcome["diagnosis"]
                      assert diagnosis["evidence"]["source_case"]==sample["case"]
                      assert diagnosis["evidence"]["source_voice"]==voice["reference_voice_index"]
                      assert diagnosis["evidence"]["operation"]==operation
                      assert diagnosis["category"]!="unclassified"
                      assert "counterexample" in diagnosis
          print("Coda pinned discrepancies classified:", result["discrepancy_categories"])
          PY
      - name: Retain exact-source evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coda-author-${{ github.sha }}
          path: ${{ runner.temp }}/coda-diff/
          if-no-files-found: warn
          retention-days: 14
      - name: Reject a mismatch
        if: steps.proof.outcome != 'success' || steps.edges.outcome != 'success' || steps.scores.outcome != 'success'
        run: exit 1
