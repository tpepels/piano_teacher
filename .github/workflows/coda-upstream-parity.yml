name: Coda author reference differential smoke

# Explicit only (except workflow edits); no long-running CI corpus.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/coda-upstream-parity.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies and syntax
        run: |
          python -m pip install -e '.[test,coda-research]' 'music21>=9.1,<10'
          python -m compileall -q scripts/compare_coda_upstream.py scripts/probe_coda_upstream_edges.py scripts/probe_coda_upstream_scores.py piano_teacher/research/coda_differential.py piano_teacher/research/coda_discrepancy.py piano_teacher/research/coda_parity_contract.py piano_teacher/research/coda_auto_chord_levels.py scripts/probe_coda_upstream_extended.py piano_teacher/research/coda_native_written.py piano_teacher/research/coda_extended_sources.py scripts/probe_coda_midi_author_algorithms.py
      - name: Pure written/sounding and discrepancy contracts
        run: timeout 20s python -m pytest -q --tb=short tests/test_coda_differential.py tests/test_coda_discrepancy.py tests/test_coda_parity_contract.py
      - name: Checkout exactly published author backend SHA
        run: |
          git clone -q --depth 1 https://github.com/annieetang/coda_backend.git "$RUNNER_TEMP/upstream"
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = 'a4eb85dfc2bd418818ca9ff775c0a11ccccb3530'
      - name: Real author code versus current MMR and generated notes
        id: proof
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/coda-diff"
          echo "${{ github.sha }}" > "$RUNNER_TEMP/coda-diff/our-revision.txt"
          timeout 95s python scripts/compare_coda_upstream.py \
            --upstream "$RUNNER_TEMP/upstream" \
            --report "$RUNNER_TEMP/coda-diff/report.json" \
            > "$RUNNER_TEMP/coda-diff/output.txt" 2>&1 || {
              cat "$RUNNER_TEMP/coda-diff/output.txt"
              exit 1
            }
          cat "$RUNNER_TEMP/coda-diff/report.json"
      - name: Compare mixed durations and record known/unknown divergences
        id: edges
        continue-on-error: true
        run: |
          timeout 70s python scripts/probe_coda_upstream_edges.py \
            --upstream "$RUNNER_TEMP/upstream" \
            --report "$RUNNER_TEMP/coda-diff/edge-cases.json" \
            > "$RUNNER_TEMP/coda-diff/edge-output.txt" 2>&1 || {
              cat "$RUNNER_TEMP/coda-diff/edge-output.txt"
              exit 1
            }
          cat "$RUNNER_TEMP/coda-diff/edge-output.txt"
      - name: Diagnose six source scores with complete written/sounding counterexamples
        id: scores
        continue-on-error: true
        run: |
          timeout 60s python scripts/probe_coda_upstream_scores.py \
            --upstream "$RUNNER_TEMP/upstream" \
            --report "$RUNNER_TEMP/coda-diff/real-source-voices.json" \
            > "$RUNNER_TEMP/coda-diff/real-source-output.txt" 2>&1 || {
              cat "$RUNNER_TEMP/coda-diff/real-source-output.txt"
              exit 1
            }
          cat "$RUNNER_TEMP/coda-diff/real-source-output.txt"
          python - "$RUNNER_TEMP/coda-diff/real-source-voices.json" <<'PY'
          import json,sys
          from collections import Counter
          result=json.load(open(sys.argv[1]))
          assert result["algorithm_total"]==60
          assert result["algorithm_exceptions"]==0
          assert result["algorithm_upstream_none"]==4
          assert result["diagnosed_cases"]==26
          assert result["unclassified_cases"]==0
          assert result["reference_mmr_exact_voices"]==12
          assert result["algorithm_sounding_exact"]==40
          assert result["algorithm_sounding_different"]==15
          assert result["algorithm_sounding_invalid_ties"]==1
          assert result["algorithm_written_exact"]==30
          assert (result["strict_exact_changed"]+
                  result["strict_exact_noop"])==30
          assert all(
              outcome["transformation_effect"]["native_matches_grading"]
              for sample in result["cases"]
              for voice in sample["voices"]
              for outcome in voice.get("algorithms",{}).values()
              if outcome["status"]=="compared"
          )
          assert result["algorithm_written_different"]==26
          assert result["algorithm_written_unavailable"]==4
          assert sum(result["discrepancy_categories"].values())==26
          assert result["discrepancy_categories"]=={
              "rest-coverage-only":5,
              "written-segmentation-tuplet":1,
              "written-segmentation-meter":4,
              "beamed-source-protected":3,
              "cross-measure-group-protected":2,
              "tuplet-source-protected":2,
              "rest-bearing-tuplet-protected":3,
              "changing-meter-dotted-quantization":4,
              "changing-meter-cross-bar-chord":1,
              "upstream-disconnected-tie":1,
          }
          for sample in result["cases"]:
              for voice in sample["voices"]:
                  for operation,outcome in voice.get("algorithms",{}).items():
                      if "diagnosis" not in outcome:
                          continue
                      diagnosis=outcome["diagnosis"]
                      assert diagnosis["evidence"]["source_case"]==sample["case"]
                      assert diagnosis["evidence"]["source_voice"]==voice["reference_voice_index"]
                      assert diagnosis["evidence"]["operation"]==operation
                      assert diagnosis["category"]!="unclassified"
                      assert "counterexample" in diagnosis
          print("Coda pinned discrepancies classified:", result["discrepancy_categories"])
          PY
      - name: Certify predeclared *transformed* strict-parity subset
        id: subset
        continue-on-error: true
        run: |
          python -m piano_teacher.research.coda_parity_contract \
            --report "$RUNNER_TEMP/coda-diff/real-source-voices.json" \
            --manifest "tests/fixtures/research/coda_supported_parity_v1.json" \
            --certificate "$RUNNER_TEMP/coda-diff/supported-subset.json"
      - name: Diagnose independent source repertoire and all original automatic chord levels
        id: expanded
        continue-on-error: true
        run: |
          timeout 55s python scripts/probe_coda_upstream_extended.py \
            --upstream "$RUNNER_TEMP/upstream" \
            --report "$RUNNER_TEMP/coda-diff/extended-source-voices.json" \
            > "$RUNNER_TEMP/coda-diff/extended-output.txt" 2>&1 || {
              cat "$RUNNER_TEMP/coda-diff/extended-output.txt"
              exit 1
            }
          cat "$RUNNER_TEMP/coda-diff/extended-output.txt"
          python - "$RUNNER_TEMP/coda-diff/extended-source-voices.json" <<'PY'
          import json,sys
          from piano_teacher.research.coda_auto_chord_levels import original_chord_levels
          result=json.load(open(sys.argv[1]))
          assert result["research_only"] is True
          assert result["author_revision"]=="a4eb85dfc2bd418818ca9ff775c0a11ccccb3530"
          assert result["source_case_count"]==10
          assert result["source_cases_diagnosed"]>=6, result["cases"]
          assert result["source_cases_diagnosed"]==7
          assert result["grid_rejected_cases"]==3
          assert result["source_voices_attempted"]==10
          assert result["voices_with_exact_mmr"]==8
          assert result["auto_chord_levels_attempted"]==37
          assert result["auto_chord_results"]=={
              "observed-strict-changing":3,
              "observed-different":2,
              "upstream-none":32,
          }
          for case in result["cases"]:
              if case["status"]!="diagnostic":
                  assert case["status"]=="grid-rejected"
                  assert case["failure_stage"]=="source-mmr"
                  assert case.get("detail")
                  continue
              assert case["automatic_chord_levels"]==list(
                  sorted(set(case["automatic_chord_levels"])))
              for voice in case["voices"]:
                  assert voice["status"] in (
                      "diagnostic", "mmr-unmatched-or-ambiguous",
                      "voice-exception")
                  if voice["status"]=="diagnostic":
                      auto=[o for o in voice["operations"]
                            if o["chord_level"] is not None]
                      assert [o["chord_level"] for o in auto]==case["automatic_chord_levels"]
          PY
      - name: Execute pinned Coda algorithms on raw-MIDI MMR
        id: midi_algorithms
        continue-on-error: true
        run: |
          timeout 75s python scripts/probe_coda_midi_author_algorithms.py \
            --upstream "$RUNNER_TEMP/upstream" \
            --report "$RUNNER_TEMP/coda-diff/midi-domain.json" \
            > "$RUNNER_TEMP/coda-diff/midi-domain-output.txt" 2>&1 || {
              cat "$RUNNER_TEMP/coda-diff/midi-domain-output.txt"
              exit 1
            }
          cat "$RUNNER_TEMP/coda-diff/midi-domain-output.txt"
      - name: Retain exact-source evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coda-author-${{ github.sha }}
          path: ${{ runner.temp }}/coda-diff/
          if-no-files-found: warn
          retention-days: 14
      - name: Reject a mismatch
        if: steps.proof.outcome != 'success' || steps.edges.outcome != 'success' || steps.scores.outcome != 'success' || steps.subset.outcome != 'success' || steps.expanded.outcome != 'success'
        run: exit 1
