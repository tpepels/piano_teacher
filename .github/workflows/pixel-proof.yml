name: Independent native pixels (phase 2)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-image-pitch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Install actual native renderer and screenshot dependencies
        run: pacman -Syu --noconfirm --needed base-devel pkgconf alsa-lib git python python-pip godot cairo pango fluidsynth soundfont-fluid xorg-server-xvfb xorg-xauth mesa
      - uses: actions/checkout@v4
      - name: Install application
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[godot,test]'
      - name: Prove pixel detector fails on displaced, erased, or broken notation
        run: .venv/bin/python -m pytest -q tests/test_native_pixel_proof.py
      - name: Independently inspect native Godot PNGs for actual note positions
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            .venv/bin/python scripts/check_native_pixels.py \
            --out /tmp/piano-independent-pixels
      - name: Capture additional independent native notation specimens
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            .venv/bin/python scripts/check_native_symbols.py \
            --out /tmp/piano-symbols
      - name: Publish symbol screenshot specimens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-symbol-specimens
          path: /tmp/piano-symbols/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish complete real image evidence, not only result counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-native-pixel-proof
          path: /tmp/piano-independent-pixels/
          if-no-files-found: warn
          retention-days: 30
