name: Composed MIDI lesson generators (bounded)

on:
  push:
    paths:
      - '.github/workflows/composed-midi-lessons.yml'
      - 'piano_teacher/adaptive_hybrid_curriculum.py'
      - 'piano_teacher/lesson_generators.py'
      - 'piano_teacher/learning.py'
      - 'piano_teacher/progress_repository.py'
      - 'tests/test_course_consolidation.py'
      - 'piano_teacher/exercise_strategies.py'
      - 'piano_teacher/library.py'
      - 'piano_teacher/server.py'
      - 'piano_teacher/fukuda_mistake_store.py'
      - 'tests/test_adaptive_hybrid_journey.py'
      - 'tests/test_composed_midi_lessons.py'
      - 'tests/test_composed_midi_repertoire.py'
      - 'tests/test_phase6_rest_handoff_real_midi.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-adaptive-curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native notation and MIDI regression dependencies
        run: timeout 75s python -m pip install -q -e '.[test,coda-research,godot]'
      - name: Run complete adaptive and original-generator contracts
        run: |
          timeout 70s python -m pytest -q --tb=short \
            tests/test_adaptive_hybrid_journey.py \
            tests/test_composed_midi_lessons.py \
            tests/test_lesson_generator_architecture.py \
            tests/test_course_consolidation.py \
            tests/test_fukuda_midi_phase4.py \
            tests/test_library.py
      - name: Verify real-MIDI internal rest transport without hardware
        run: timeout 55s python -m pytest -q --tb=short tests/test_phase6_rest_handoff_real_midi.py
      - name: Verify real MIDI callback grading and error review across rest
        run: timeout 75s python -m pytest -q --tb=short tests/test_phase6_rest_handoff_real_midi.py::test_entire_real_midi_performance_uses_callback_grading_and_saved_review
      - name: Verify all 17 full-length original MIDI scores
        run: |
          timeout 75s python -m pytest -q --tb=short \
            tests/test_composed_midi_repertoire.py
