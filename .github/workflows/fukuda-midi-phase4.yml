name: Phase 4 Fukuda MIDI (bounded)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fukuda-midi-phase4.yml'
      - 'piano_teacher/fukuda_midi.py'
      - 'piano_teacher/fukuda_midi_performance.py'
      - 'scripts/analyze_fukuda_midi.py'
      - 'scripts/audit_fukuda_full_midi_corpus.py'
      - 'piano_teacher/fukuda_mistake_store.py'
      - 'piano_teacher/server.py'
      - 'piano_teacher/preprocessing_cache.py'
      - 'piano_teacher/fukuda_mistake_store.py'
      - 'piano_teacher/application/strategy_session.py'
      - 'piano_teacher/lesson_generators.py'
      - 'piano_teacher/learning.py'
      - 'piano_teacher/exercise_strategies.py'
      - 'tests/test_fukuda_midi_phase4.py'

permissions:
  contents: read

jobs:
  midi-fukuda:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline MIDI dependencies
        run: python -m pip install -e '.[test,coda-research]'
      - name: Compile and test all Phase 4 source contracts
        run: |
          python -m compileall -q piano_teacher/fukuda_midi.py piano_teacher/fukuda_midi_performance.py piano_teacher/lesson_generators.py tests/test_fukuda_midi_phase4.py
          timeout 50s python -m pytest -q --tb=short \
            tests/test_fukuda_midi_phase4.py \
            tests/test_exercise_strategies.py \
            tests/test_lesson_generator_architecture.py

      - name: Audit all independent fixtures and shipped real MIDI pieces
        run: |
          timeout 55s python -m scripts.audit_fukuda_full_midi_corpus \
            --budget-seconds 45 --output "$RUNNER_TEMP/fukuda-midi-corpus.json"
      - name: Retain real-score source-identity evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fukuda-midi-all-scores-${{ github.sha }}
          path: ${{ runner.temp }}/fukuda-midi-corpus.json
          if-no-files-found: warn
          retention-days: 14
