name: Musical scheduler integration and removal acceptance

on:
  push:
    branches: [main]
    paths:
      - 'piano_teacher/**'
      - 'tests/test_musical_scheduler.py'
      - 'tests/test_continuation_deadline.py'
      - 'tests/test_transport_commands.py'
      - 'tests/test_listen_session.py'
      - 'scripts/audit-musical-scheduler.py'
      - 'scripts/ci-smoke.sh'
      - '.github/workflows/musical-scheduler-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musical-scheduler-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-scheduler-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install real MIDI and engraving dependencies
        run: python -m pip install -e '.[test,godot]'
      - name: Assert no legacy timing API or independent production BPM conversion
        run: python scripts/audit-musical-scheduler.py
      - name: Exercise every migrated scheduling and grading consumer
        run: |
          timeout 660s python -m pytest -q --tb=short \
            tests/test_musical_scheduler.py \
            tests/test_attempt_progression.py \
            tests/test_assessment_service.py \
            tests/test_continuation_deadline.py \
            tests/test_first_play_count_in.py \
            tests/test_lesson_settings_grading.py \
            tests/test_listen_session.py \
            tests/test_listen_perform.py \
            tests/test_midi_calibration.py \
            tests/test_moving_short_lead.py \
            tests/test_phase1_transport.py \
            tests/test_retained_score_pipeline.py \
            tests/test_seamless_stage_runway.py \
            tests/test_transport_commands.py \
            tests/test_transport_projection.py \
            tests/test_visual_transport.py \
            tests/test_user_midi_visual_regression.py \
            tests/test_live_input_view.py \
            tests/test_live_input_index.py \
            tests/test_live_feedback.py \
            tests/test_timed_real_scores_and_recovery.py \
            tests/test_recovery_projection.py \
            tests/test_rolling_recovery_transition.py \
            tests/test_state_projection.py \
            tests/test_practice.py \
            tests/test_fukuda_midi_phase4.py \
            tests/test_demo_audio.py \
            tests/test_demo_cache_bounds.py \
            tests/test_calibration_grading_integration.py \
            tests/test_practice_stage_tempo_ladder.py

  godot-score-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install the exact Godot 4.7.2 engine
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 65 \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
      - name: Verify visual clock, queue geometry and immutable continuation
        env:
          GODOT_BIN: ${{ runner.temp }}/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          for fixture in \
            continuous_score_flow \
            tempo_timeline \
            visual_transport_clock \
            continuation_plan \
            score_stream_admission \
            stream_score_queue \
            transport_reservation_integration \
            seamless_score_runway; do
            bash scripts/godot-test.sh 45s --headless --audio-driver Dummy \
              --path godot --script "$PWD/tests/godot/$fixture.gd"
          done
