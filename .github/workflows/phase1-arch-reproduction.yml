name: Phase 1 Arch workstation framebuffer reproduction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-arch-reproduction.yml'
permissions:
  contents: read
jobs:
  arch-physical-frames:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install Arch native renderer, Python, model and X framebuffer
        run: pacman -Syu --noconfirm --needed base-devel pkgconf alsa-lib git python python-pip godot cairo pango nodejs npm xorg-server-xvfb xorg-xauth mesa libglvnd
      - uses: actions/checkout@v4
      - name: Trust exact checkout workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install actual test package and trained fingering providers
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[godot,test]' numpy
          bash scripts/setup-fingering.sh
          godot --headless --version
      - name: Reproduce nine failed shard 1 classes on Arch
        run: |
          mkdir -p "$RUNNER_TEMP/phase1-arch"
          set -o pipefail
          timeout 750s xvfb-run -a -s '-screen 0 2000x1100x24' \
            .venv/bin/python -m pytest -q --tb=short \
            --basetemp="$RUNNER_TEMP/phase1-arch/captures" \
            --junitxml="$RUNNER_TEMP/phase1-arch/junit.xml" \
            tests/test_fingering_obstacle_geometry.py \
            tests/test_native_voice_collisions.py \
            tests/test_full_notation_difficult_cases.py \
            2>&1 | tee "$RUNNER_TEMP/phase1-arch/pytest.txt"
      - name: Report independent observed shaft and placement diagnostics
        if: always()
        run: |
          .venv/bin/python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'phase1-arch/captures'
          for path in root.rglob('proof.json'):
              try:
                  report=json.loads(path.read_text())
                  for row in report.get('measured',[]):
                      stem=row.get('features',{}).get('stem',{})
                      if stem.get('status')!='verified':
                          print('UNVERIFIED_SHAFT',path.parent.name,row.get('source_id'),
                                row.get('voice'),json.dumps(stem)[:2500])
              except Exception as e: print('PROOF_ERROR',path,str(e))
          for path in root.rglob('report.json'):
              try:
                  report=json.loads(path.read_text())
                  for frame in report.get('frames',[]):
                      print('ANNOTATION_FRAME',path.parent.name,frame.get('file'),
                            frame.get('gap'),'labels',len(frame.get('labels',[])),
                            'issues',frame.get('placement_issues'))
              except Exception as e: print('FRAME_ERROR',path,str(e))
          PY
      - name: Preserve actual Arch screenshot and failed proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-arch-${{ github.sha }}
          path: ${{ runner.temp }}/phase1-arch/
          retention-days: 14
          if-no-files-found: warn
