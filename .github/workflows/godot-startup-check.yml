name: Godot 4.7.2 startup syntax (bounded)

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - 'tests/godot/visual_transport_clock.gd'
      - 'tests/godot/fukuda_midi_strategy.gd'
      - 'tests/godot/coda_piece_strategy.gd'
      - 'tests/godot/settings_ownership.gd'
      - 'scripts/check-godot-syntax.sh'
      - 'tests/godot/score_asset_lifecycle.gd'
      - 'tests/godot/native_score_feedback.gd'
      - 'tests/godot/practice_screen.gd'
      - '.github/workflows/godot-startup-check.yml'
  pull_request:
    paths:
      - 'godot/**'
      - 'tests/godot/visual_transport_clock.gd'
      - 'tests/godot/fukuda_midi_strategy.gd'
      - 'tests/godot/coda_piece_strategy.gd'
      - 'tests/godot/settings_ownership.gd'
      - 'scripts/check-godot-syntax.sh'
      - 'tests/godot/score_asset_lifecycle.gd'
      - 'tests/godot/native_score_feedback.gd'
      - '.github/workflows/godot-startup-check.yml'

permissions:
  contents: read

concurrency:
  group: godot-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Get matching Godot editor binary
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            --max-time 65 \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Parse startup and native request adapters (no application launch)
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: bash scripts/check-godot-syntax.sh
      - name: Verify future-only score admissions and bounded retained projection
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          timeout 15s "$GODOT_BIN" --headless --path godot \
            --script "$PWD/tests/godot/score_stream_admission.gd"
          timeout 15s "$GODOT_BIN" --headless --path godot \
            --script "$PWD/tests/godot/retained_note_projection.gd"
      - name: Assert constant visual velocity across a delayed rest handoff
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          timeout 15s "$GODOT_BIN" --headless --path godot \
            --script "$PWD/tests/godot/visual_transport_clock.gd"
      - name: Verify whole-piece Coda and composed strategy Settings metadata
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          timeout 15s "$GODOT_BIN" --headless --path godot \
            --script "$PWD/tests/godot/coda_piece_strategy.gd"
      - name: Verify Settings strategy capability contracts
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          timeout 15s "$GODOT_BIN" --headless --path godot \
            --script "$PWD/tests/godot/settings_ownership.gd" -- preferences
      - name: Verify Phase 4 native Fukuda strategy and lesson navigation
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          timeout 15s "$GODOT_BIN" --headless --path godot \
            --script "$PWD/tests/godot/fukuda_midi_strategy.gd"

