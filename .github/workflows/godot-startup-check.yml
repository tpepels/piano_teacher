name: Godot 4.7.2 startup syntax (bounded)

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - 'tests/godot/**'
      - 'scripts/check-godot-syntax.sh'
      - '.github/workflows/godot-startup-check.yml'
  pull_request:
    paths:
      - 'godot/**'
      - 'tests/godot/**'
      - 'scripts/check-godot-syntax.sh'
      - '.github/workflows/godot-startup-check.yml'

permissions:
  contents: read

concurrency:
  group: godot-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Get matching Godot editor binary
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            --max-time 65 \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Parse startup and native request adapters (no application launch)
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: bash scripts/check-godot-syntax.sh
      - name: Decode and play all four bundled Japanese count-in recordings
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 15s --headless --audio-driver Dummy --path godot \
            --script "$PWD/tests/godot/countin_voice_assets.gd"
      - name: Assert unified beat-cue scheduling across Play Pause Resume and retry
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 15s --headless --path godot \
            --script "$PWD/tests/godot/countin_cue_timeline.gd"
      - name: Verify preflighted transport reservation and online queue invariants
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 20s --headless --path godot \
            --script "$PWD/tests/godot/transport_reservation_integration.gd"
      - name: Verify transactional retry admission and stale plan recovery
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 20s --headless --path godot \
            --script "$PWD/tests/godot/score_recovery_transaction.gd"
      - name: Verify graded per-note status and tiny glyph-shaped glow
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 20s --headless --path godot \
            --script "$PWD/tests/godot/native_score_feedback.gd"
      - name: Verify future-only score admissions and bounded retained projection
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 15s --headless --path godot \
            --script "$PWD/tests/godot/score_stream_admission.gd"
          bash scripts/godot-test.sh 15s --headless --path godot \
            --script "$PWD/tests/godot/retained_note_projection.gd"
      - name: Verify one owner for note/rest staging, compilation and retirement
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 20s --headless --path godot \
            --script "$PWD/tests/godot/stream_retained_lifecycle.gd"
      - name: Verify immutable online FIFO and offline passage conservation
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 20s --headless --path godot \
            --script "$PWD/tests/godot/stream_score_queue.gd"
      - name: Verify perpetual blank barline meter and source origin
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 15s --headless --path godot \
            --script "$PWD/tests/godot/moving_meter_grid.gd"
      - name: Verify full-score source span indexing against exhaustive symbol order
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 20s --headless --path godot \
            --script "$PWD/tests/godot/source_span_index.gd"
      - name: Verify safe retractable measure seams and complete source connectors
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 20s --headless --path godot \
            --script "$PWD/tests/godot/score_stream_window_cuts.gd"
      - name: Validate projected notehead nonoverlap across pause resume and retry
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 15s --headless --path godot \
            --script "$PWD/tests/godot/stream_rendered_note_overlap.gd"
      - name: Assert constant visual velocity across a delayed rest handoff
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 15s --headless --path godot \
            --script "$PWD/tests/godot/visual_transport_clock.gd"
      - name: Verify whole-piece Coda and composed strategy Settings metadata
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 15s --headless --path godot \
            --script "$PWD/tests/godot/coda_piece_strategy.gd"
      - name: Verify Settings strategy capability contracts
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 15s --headless --path godot \
            --script "$PWD/tests/godot/settings_ownership.gd" -- preferences
      - name: Verify Phase 4 native Fukuda strategy and lesson navigation
        env:
          GODOT_BIN: /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
        run: |
          bash scripts/godot-test.sh 15s --headless --path godot \
            --script "$PWD/tests/godot/fukuda_midi_strategy.gd"

