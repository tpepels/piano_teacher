name: Reusable exact native release gate

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
    outputs:
      revision:
        description: Exact event commit that passed corpus, mutation and release policy gates
        value: ${{ jobs.release-gate.outputs.revision }}
      report-artifact:
        description: Diagnostic release decision, available even when blocked
        value: phase4-native-release-report
      evidence-artifact:
        description: All compact ledgers, raw captures, mutation registries and evidence manifest
        value: phase4-native-release-evidence

permissions:
  contents: read

jobs:
  validate-revision:
    name: Require this event's immutable commit before running audits
    runs-on: ubuntu-latest
    steps:
      - id: revision
        env:
          REVISION: ${{ inputs.revision }}
          EVENT_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, re
          revision = os.environ['REVISION']
          if not re.fullmatch(r'[0-9a-f]{40}', revision) or revision != os.environ['EVENT_REVISION']:
              raise SystemExit('Audit input must be the full SHA of this exact event')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'revision={revision}\n')
          PY

  corpus:
    needs: validate-revision
    uses: ./.github/workflows/phase3-corpus.yml
    with:
      revision: ${{ inputs.revision }}

  mutations:
    needs: validate-revision
    uses: ./.github/workflows/phase3-whole-piece.yml
    with:
      revision: ${{ inputs.revision }}

  phase2:
    needs: validate-revision
    uses: ./.github/workflows/pixel-proof.yml
    with:
      revision: ${{ inputs.revision }}

  report-and-package:
    name: Always package evidence and report release readiness
    needs: [corpus, mutations, phase2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies for independent trusted mutation collection
        run: python -m pip install -e '.[godot,test]'
      - name: Prepare diagnostic directories outside verification inputs
        if: always()
        run: mkdir -p /tmp/phase4/reports /tmp/phase4/raw /tmp/phase4/mutations /tmp/phase4/evidence /tmp/phase4/prior-phases
      - name: Fetch actual Phase 2 native pitch image evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase2-native-pixel-proof
          path: /tmp/phase4/prior-phases/phase2-native-pixel-proof
      - name: Fetch actual Phase 2 native symbol evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase2-symbol-specimens
          path: /tmp/phase4/prior-phases/phase2-symbol-specimens
      - name: Record actual Phase 2 result and revision without promoting failures
        id: prerequisites
        if: always()
        env:
          REVISION: ${{ inputs.revision }}
          PHASE2_RESULT: ${{ needs.phase2.result }}
          PHASE2_REVISION: ${{ needs.phase2.outputs.revision }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('/tmp/phase4/prior-phases/prerequisites.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              'schema_version': 1, 'revision': os.environ['REVISION'],
              'phase2': {'result': os.environ['PHASE2_RESULT'], 'revision': os.environ['PHASE2_REVISION']},
          }, indent=2) + '\n')
          PY
      - name: Fetch full semantic artifacts for all 51 cases
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phase3-semantic-reports
          path: /tmp/phase4/raw
      - name: Fetch all 51 compact visual ledgers
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: phase3-report-*
          path: /tmp/phase4/reports
      - name: Fetch full native PNG, reference and model artifacts for all 51 cases
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: phase3-visual-score-*
          path: /tmp/phase4/raw
      - name: Fetch all four mutation registries and raw JUnit files
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: notation-mutations-*
          path: /tmp/phase4/mutations
      - name: Copy all compact semantic reports without changing producer provenance
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('/tmp/phase4/raw')
          for source in root.glob('phase3-semantic-report-*/summary.json'):
              target = Path('/tmp/phase4/reports') / source.parent.name / source.name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          PY
      - name: Package complete available evidence even when any producer failed
        id: package
        if: always()
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          python scripts/package_notation_evidence.py \
            --reports /tmp/phase4/reports --raw /tmp/phase4/raw \
            --out /tmp/phase4/evidence --revision "$REVISION"
      - name: Audit release readiness even when packaging or upstream jobs failed
        id: audit
        if: always()
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          python scripts/audit_native_release.py \
            --reports /tmp/phase4/reports \
            --evidence /tmp/phase4/evidence/evidence-manifest.json \
            --mutations /tmp/phase4/mutations --revision "$REVISION" \
            --prerequisites /tmp/phase4/prior-phases/prerequisites.json \
            --out /tmp/phase4/native-release.json \
            --markdown /tmp/phase4/native-release.md
      - name: Add the release decision to the run summary
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          report = Path('/tmp/phase4/native-release.md')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(report.read_text() if report.exists() else 'BLOCKED: release report could not be produced.\n')
          PY
      - name: Preserve the release report and evidence manifest even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-native-release-report
          path: |
            /tmp/phase4/native-release.json
            /tmp/phase4/native-release.md
            /tmp/phase4/evidence/evidence-manifest.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve all 102 compact reports and all available raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-native-release-evidence
          path: |
            /tmp/phase4/evidence/
            /tmp/phase4/mutations/
            /tmp/phase4/prior-phases/
            /tmp/phase4/native-release.json
            /tmp/phase4/native-release.md
          if-no-files-found: error
          retention-days: 30

  release-gate:
    name: Require exact revision and passing release evidence
    needs: [corpus, mutations, phase2, report-and-package]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.decision.outputs.revision }}
    steps:
      - id: decision
        env:
          REVISION: ${{ inputs.revision }}
          EVENT_REVISION: ${{ github.sha }}
          CORPUS_RESULT: ${{ needs.corpus.result }}
          MUTATIONS_RESULT: ${{ needs.mutations.result }}
          PHASE2_RESULT: ${{ needs.phase2.result }}
          REPORT_RESULT: ${{ needs.report-and-package.result }}
          CORPUS_REVISION: ${{ needs.corpus.outputs.revision }}
          MUTATIONS_REVISION: ${{ needs.mutations.outputs.revision }}
          PHASE2_REVISION: ${{ needs.phase2.outputs.revision }}
        run: |
          python - <<'PY'
          import os, re
          revision = os.environ['REVISION']
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('Release gate requires a full immutable SHA')
          if any(os.environ[key] != revision for key in ('EVENT_REVISION', 'CORPUS_REVISION', 'MUTATIONS_REVISION', 'PHASE2_REVISION')):
              raise SystemExit('Release evidence does not belong to this exact event revision')
          if any(os.environ[key] != 'success' for key in ('CORPUS_RESULT', 'MUTATIONS_RESULT', 'PHASE2_RESULT', 'REPORT_RESULT')):
              raise SystemExit('Release blocked: corpus, mutations, Phase 2 and release report must all pass')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'revision={revision}\n')
          PY
