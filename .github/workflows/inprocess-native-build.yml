name: Embedded Python bridge (bounded build)

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'piano_teacher/inprocess.py'
      - 'piano_teacher/server.py'
      - 'piano_teacher/lesson_generators.py'
      - 'piano_teacher/learning.py'
      - 'piano_teacher/exercise_strategies.py'
      - 'piano_teacher/engraving/**'
      - 'piano_teacher/application/score_artifacts.py'
      - 'piano_teacher/application/score_preparation.py'
      - 'godot/score_asset_session.gd'
      - 'godot/score_asset_queue.gd'
      - 'godot/practice_score_stage.gd'
      - 'godot/practice_screen.gd'
      - 'godot/main.gd'
      - 'godot/notation/native/**'
      - 'godot/native_bridge_smoke.gd'
      - 'godot/production_ui_smoke.gd'
      - 'godot/production_session_journey.gd'
      - 'godot/inprocess_bus.gd'
      - 'scripts/verify-native-bridge.sh'
      - 'scripts/build-inprocess.sh'
      - 'scripts/package-inprocess.sh'
      - '.github/workflows/inprocess-native-smoke.yml'
      - 'scripts/install-inprocess-artifact.py'
      - 'run.sh'
      - '.github/workflows/inprocess-native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedded-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GDExtension (Linux x86_64 / CPython 3.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install compile tools in CI only
        run: python -m pip install 'scons>=4.7,<5'
      - name: Cache pinned godot-cpp compilation
        uses: actions/cache@v4
        with:
          # The Godot C++ binding version is pinned in build-inprocess.sh.
          # Cached external build objects cannot conceal any native bridge
          # source change; SCons still compiles and links current sources.
          path: native/godot-cpp
          key: godot-cpp-${{ runner.os }}-${{ runner.arch }}-10.0.0-stable-scons4-release-v1
      - name: Compile native extension
        env:
          PIANO_PYTHON: python
        run: bash scripts/build-inprocess.sh
      - name: Check compiled artifact and CPython ABI
        shell: bash
        run: |
          test -s godot/native/bin/libpiano_bridge.linux.template_release.x86_64.so
          test -f godot/native/piano_bridge.gdextension
          test "$(cat godot/native/python-abi.txt)" = "$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          export LD_LIBRARY_PATH="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          file godot/native/bin/libpiano_bridge.linux.template_release.x86_64.so
          nm -D godot/native/bin/libpiano_bridge.linux.template_release.x86_64.so | grep piano_bridge_library_init
          ldd godot/native/bin/libpiano_bridge.linux.template_release.x86_64.so
          ! ldd godot/native/bin/libpiano_bridge.linux.template_release.x86_64.so | grep 'not found'
      - name: Archive precompiled plugin (no local SCons required)
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          mkdir -p staging/godot/native/bin
          cp godot/native/bin/libpiano_bridge.linux.template_release.x86_64.so staging/godot/native/bin/
          cp godot/native/piano_bridge.gdextension staging/godot/native/
          cp godot/native/python-abi.txt staging/godot/native/
          printf '%s\n' "$REVISION" > staging/godot/native/source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: piano-native-linux-x86_64-py314
          path: staging/
          if-no-files-found: error
          retention-days: 14
