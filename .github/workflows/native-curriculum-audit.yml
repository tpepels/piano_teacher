name: Exhaustive native notation audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check_native_notation.py'
      - '.github/workflows/native-curriculum-audit.yml'

jobs:
  native-curriculum:
    name: Native audit · ${{ matrix.label }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ala
            only: 'Ala_'
          - label: Autumn Leaves
            only: 'Autunm_Leaves'
          - label: Chopin
            only: 'Nocturne_Op_9'
          - label: Danny Boy
            only: 'Danny_Boy'
          - label: Merry-Go-Round
            only: 'Merry-Go-Round'
          - label: Peace Piece
            only: 'Peace_Piece'
          - label: Waltz for Debby
            only: 'Waltz_for_Debby'
    steps:
      - name: Install Godot and native notation dependencies
        run: pacman -Syu --noconfirm --needed base-devel pkgconf alsa-lib git python python-pip godot cairo pango
      - uses: actions/checkout@v4
      - name: Trust the exact container workspace for provenance
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install application
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[godot,test]'
      - name: Verify every native curriculum stage without fallback or missing noteheads
        env:
          PIANO_TEACHER_NATIVE_NOTATION: '1'
        run: |
          .venv/bin/python scripts/check_native_notation.py \
            --only "${{ matrix.only }}" \
            --compact \
            --output "/tmp/native-audit/${{ matrix.label }}"
      - name: Upload full counts and failed-stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-curriculum-${{ matrix.label }}
          path: /tmp/native-audit/${{ matrix.label }}
          if-no-files-found: warn
          retention-days: 21
