name: Dense real-source staff-rail regression (Godot 4.7.2)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-staff-rail-regression.yml'
      - 'tests/test_native_staff_rail_recovery.py'
      - 'tests/test_full_notation_difficult_cases.py'
      - 'piano_teacher/notation/phase3_pixels.py'
      - 'piano_teacher/notation/captured_frames.py'
      - 'piano_teacher/notation/ledger_pixels.py'
      - 'tests/godot/native_verovio_overlay.gd'
      - 'tests/test_phase3_ledger_pixels.py'
      - 'piano_teacher/notation/pixel_proof.py'
      - 'piano_teacher/notation/photographed_staff_rails.py'
      - 'piano_teacher/notation/feature_pixels.py'
      - 'piano_teacher/notation/structure_pixels.py'
      - 'piano_teacher/notation/rest_intervention.py'
      - 'tests/test_phase3_rest_placement.py'
      - 'piano_teacher/notation/extra_symbol_pixels.py'
      - 'piano_teacher/notation/connector_pixels.py'
      - 'piano_teacher/notation/assets/beams.py'
      - 'piano_teacher/notation/assets/tuplets.py'
      - 'godot/notation/native/glyphs.gd'
      - 'godot/notation/native/symbol_painter.gd'
      - 'tests/test_verovio_beam_fragments.py'
      - 'tests/test_tuplet_adaptive_raster_bounds.py'
      - 'tests/test_connector_beam_pixel_profile.py'
      - 'tests/test_extra_symbol_candidate_index.py'
      - 'tests/test_procedural_rest_ownership.py'
      - 'piano_teacher/notation/procedural_rest_ownership.py'
      - 'tests/test_post_group_connector_photos.py'

permissions:
  contents: read

concurrency:
  group: staff-rail-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-frames:
    name: Hanon, Chopin, Debussy + deleted-rail negatives
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install framebuffer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 unzip
          python -m pip install -e '.[godot,test]'
          curl --fail --location --silent --show-error --retry 2 --max-time 65 \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            -o /tmp/godot.zip
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 755 /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Check independent pixel and lossless photo-cache contracts
        run: |
          timeout 100s python -m pytest -q --tb=short \
            tests/test_photo_cache.py \
            tests/test_phase3_ledger_pixels.py \
            tests/test_phase3_rest_placement.py \
            tests/test_phase3_ledger_coverage.py \
            tests/test_native_pixel_proof.py \
            tests/test_feature_pixel_ownership.py \
            tests/test_connector_beam_pixel_profile.py \
            tests/test_extra_symbol_candidate_index.py \
            tests/test_procedural_rest_ownership.py \
            tests/test_post_group_connector_photos.py \
            tests/test_verovio_beam_fragments.py \
            tests/test_tuplet_adaptive_raster_bounds.py
      - name: Capture authentic multi-frame rail evidence
        run: |
          mkdir -p "$RUNNER_TEMP/rail-proof"
          set -o pipefail
          timeout 650s xvfb-run -a -s '-screen 0 1700x1000x24' \
            python -m pytest -q -rx --tb=short \
              --basetemp="$RUNNER_TEMP/rail-proof/captures" \
              --junitxml="$RUNNER_TEMP/rail-proof/junit.xml" \
              tests/test_native_staff_rail_recovery.py \
              2>&1 | tee "$RUNNER_TEMP/rail-proof/pytest.txt"
      - name: Run full symbol inventory, not just sampled staff rails
        run: |
          mkdir -p "$RUNNER_TEMP/full-symbol-proof"
          set -o pipefail
          timeout 940s xvfb-run -a -s '-screen 0 1700x1000x24' \
            python -m pytest -q -rx --tb=short \
              --basetemp="$RUNNER_TEMP/full-symbol-proof/captures" \
              --junitxml="$RUNNER_TEMP/full-symbol-proof/junit.xml" \
              tests/test_full_notation_difficult_cases.py \
              2>&1 | tee "$RUNNER_TEMP/full-symbol-proof/pytest.txt"
      - name: Retain source score, actual screenshots and corrupted controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dense-rails-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rail-proof/
            ${{ runner.temp }}/full-symbol-proof/
          if-no-files-found: warn
          retention-days: 14
