name: Phase 1 overlapping voice connector evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-connector-diagnostics.yml'
      - 'piano_teacher/notation/connector_pixels.py'
      - 'tests/test_native_voice_collisions.py'
permissions:
  contents: read
jobs:
  connector-pixels:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install precise real score and actual framebuffer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 unzip
          python -m pip install -e '.[godot,test]' numpy
          curl --fail --location --silent --show-error --retry 2 --max-time 65 \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          sudo install -m 755 "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot
      - name: Diagnose shard-2 real-source stem and tuplet evidence
        run: |
          mkdir -p "$RUNNER_TEMP/connectors/shard2"
          PYTHONPATH=tests:. xvfb-run -a -s '-screen 0 2000x1100x24' python - <<'PY'
          import json,os
          from pathlib import Path
          from piano_teacher.notation.feature_pixels import verify_note_feature_pixels
          from piano_teacher.notation.connector_pixels import verify_tuplet_pixels, _inventory, _tuplet
          from piano_teacher.notation.stem_pixels import reference_stem_extension
          from piano_teacher.notation.captured_frames import CapturedFrames
          from piano_teacher.notation.proof import read_written_score
          for direction in ('up','down'):
              for automatic in (False,True):
                  try:
                      length=reference_stem_extension('quarter',(0,1,3,8),direction,28,('G',2,0),automatic=automatic)
                      print('SHARD2_STEM_REFERENCE',direction,automatic,round(length,4),flush=True)
                  except ValueError as exc:
                      print('SHARD2_STEM_REFERENCE',direction,automatic,str(exc),flush=True)
          folder=Path('tests/fixtures/native_ledger_chord')
          report=verify_note_feature_pixels((folder/'score.musicxml').read_text(),folder)
          for row in report['measured']:
              if row['beat']==0:
                  print('SHARD2_CHORD',json.dumps(row,default=str),flush=True)
          import test_verovio_wide_tuplet as test
          class Factory:
              def mktemp(self,name):
                  folder=Path(os.environ['RUNNER_TEMP'])/'connectors/shard2'/name
                  folder.mkdir(parents=True,exist_ok=True)
                  return folder
          folder=test.real_native_frames.__wrapped__(Factory())
          proof=verify_tuplet_pixels((folder/'score.musicxml').read_text(),folder)
          expected=[n['id'] for n in json.loads((test.SOURCE/'group-model.json').read_text())['notation_events']]
          for row in proof['measured']:
              if row.get('event_ids')==expected:
                  print('SHARD2_TUPLET',json.dumps(row,default=str),flush=True)
          (folder/'diagnostic-shard2-proof.json').write_text(json.dumps(proof,indent=2,default=str))
          xml=(folder/'score.musicxml').read_text()
          written=read_written_score(xml)
          rows=_inventory(written, [(folder/'verovio-0.svg').read_text()], 'tuplet','both')
          frames=CapturedFrames(folder,written)
          for row in rows:
              if [e['id'] or e['source']['id'] for e in row['events']]!=expected:
                  continue
              sources=sorted({e['beat'] for e in row.get('leaders',row['events'])})
              targets=list(dict.fromkeys(sources+frames.nearby_clocks(sources)
                        +frames.post_group_clocks(sources)+frames.pre_group_clocks(sources)))
              for target in targets:
                  try:
                      result=_tuplet(row,frames,target)
                      print('SHARD2_TUPLET_FRAME',float(target),json.dumps(result,default=str)[:4000],flush=True)
                  except Exception as exc:
                      print('SHARD2_TUPLET_FRAME',float(target),type(exc).__name__,str(exc),flush=True)
          PY
      - name: Verify all six previously failing full-shard tests
        run: |
          xvfb-run -a -s '-screen 0 2000x1100x24' python -m pytest -q --tb=short \
            tests/test_native_review_followups.py::test_source_chord_shares_one_absent_flag_attachment_at_its_common_stem \
            tests/test_native_review_followups.py::test_unrelated_ink_at_a_common_stem_blocks_absence_for_every_chord_member \
            tests/test_source_beam_pixel_fidelity.py::test_beam_photographic_window_contains_actual_three_level_ink_without_reconstructing_it \
            tests/test_verovio_wide_tuplet.py::test_real_native_recovered_tuplet_has_independently_identified_number \
            tests/test_verovio_wide_tuplet.py::test_corrupted_recovered_real_numeral_is_rejected
      - name: Require intact three-tone chords and reject erased stems
        run: |
          xvfb-run -a -s '-screen 0 2000x1100x24' python -m pytest -q --tb=short \
            tests/test_feature_pixel_ownership.py::test_note_feature_claims_are_local_to_each_call_and_do_not_escape_the_report \
            tests/test_native_notation_library.py::test_legible_verovio_chord_stems_are_not_rejected_by_a_fixed_three_space_rule \
            tests/test_native_notation_library.py::test_reference_stem_allowance_still_rejects_a_truncated_chord_stem
      - name: Inspect remaining real-source chord verification discrepancies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from piano_teacher.notation.feature_pixels import verify_note_feature_pixels
          cases=[
              ('NATIVE_KEY',Path('tests/fixtures/native_structure_key'),'score.musicxml'),
              ('CHORD_FEATURE',Path('tests/fixtures/feature_pixels/chords'),'source.musicxml'),
          ]
          for name,folder,filename in cases:
              report=verify_note_feature_pixels((folder/filename).read_text(),folder,hand='right')
              print('CHORD_DISCREPANCY_COVERAGE',name,json.dumps(report['by_construct']['stem']),flush=True)
              for row in report['measured']:
                  if name=='NATIVE_KEY' and row['beat']!=3.0:
                      continue
                  stem=row['features'].get('stem')
                  if stem is None or stem['status']=='verified':
                      continue
                  print('CHORD_DISCREPANCY',name,json.dumps(
                      {'beat':row['beat'],'staff':row['staff'],'spelling':row['spelling'],
                       'stem':stem},default=str),flush=True)
          PY
      - name: Capture authored beam and tuplet failures with strict source checks
        run: |
          mkdir -p "$RUNNER_TEMP/connectors"
          xvfb-run -a -s '-screen 0 2000x1100x24' \
            timeout 365s python -m pytest -q --tb=short \
            -k 'beamed-overlap or tuplet-overlap' \
            --basetemp="$RUNNER_TEMP/connectors/captures" \
            tests/test_native_voice_collisions.py
      - name: Keep negative beam, stem and bracket erasure proofs strict
        if: always()
        run: |
          timeout 150s xvfb-run -a -s '-screen 0 2000x1100x24' \
            python -m pytest -q --tb=short \
              tests/test_connector_pixels.py \
              tests/test_connector_beam_pixel_profile.py \
              tests/test_post_group_connector_photos.py \
              tests/test_tuplet_adaptive_raster_bounds.py
      - name: Explain original reference and actual bitmap independently
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from piano_teacher.notation.connector_pixels import verify_beam_pixels,verify_tuplet_pixels
          base=Path(os.environ['RUNNER_TEMP'])/'connectors/captures'
          for case, verifier in [('beamed-overlap0',verify_beam_pixels),
                                 ('tuplet-overlap0',verify_tuplet_pixels)]:
              folder=base/case
              xml=(folder/'source.musicxml').read_text()
              report=verifier(xml,folder,hand='right')
              (folder/'diagnostic-connector-proof.json').write_text(json.dumps(report,indent=2,default=str))
              print('CONNECTOR_CASE',case, 'COVERAGE',report.get('coverage'))
              for item in report.get('measured',[]):
                  print('CONNECTOR_MEASUREMENT',case,json.dumps(item,default=str)[:18000])
          PY
      - name: Keep exact SVG and framebuffer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-source-connector-${{ github.sha }}
          path: ${{ runner.temp }}/connectors/
          retention-days: 14
          if-no-files-found: warn
