name: Phase 1 full-shard native acceptance regressions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-shard-regressions.yml'
      - 'piano_teacher/notation/stem_pixels.py'
      - 'godot/notation/native/fingering_annotations.gd'
      - 'godot/notation/native/fingering_spatial_layout.gd'
      - 'godot/notation/native/voice_layout.gd'
      - 'tests/test_native_voice_collisions.py'
      - 'tests/test_fingering_obstacle_geometry.py'
      - 'tests/test_full_notation_difficult_cases.py'
permissions:
  contents: read
concurrency:
  group: phase1-shard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-failures:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install physical framebuffer, exact Godot, and LumiKey
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 unzip
          python -m pip install -e '.[godot,test]' numpy
          curl --fail --location --silent --show-error --retry 2 --max-time 65 \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          sudo install -m 755 "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot
          bash scripts/setup-fingering.sh
      - name: Run exact failing cases and preserve unmodified oracle evidence
        run: |
          mkdir -p "$RUNNER_TEMP/phase1"
          set -o pipefail
          timeout 690s xvfb-run -a -s '-screen 0 2000x1100x24' \
            python -m pytest -q -vv --tb=short \
              --basetemp="$RUNNER_TEMP/phase1/captures" \
              --junitxml="$RUNNER_TEMP/phase1/junit.xml" \
              tests/test_fingering_obstacle_geometry.py \
              tests/test_native_voice_collisions.py \
              tests/test_full_notation_difficult_cases.py \
            2>&1 | tee "$RUNNER_TEMP/phase1/pytest.txt"
      - name: Preserve proof images, measured ink and actual source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-native-${{ github.sha }}
          path: ${{ runner.temp }}/phase1/
          retention-days: 14
          if-no-files-found: warn
      - name: Expose stem and numeral evidence in logs even after failure
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          root=Path(os.environ['RUNNER_TEMP'])/'phase1/captures'
          for path in list(root.rglob('proof.json'))[:12]:
              try:
                  report=json.loads(path.read_text())
                  for row in report.get('measured',[]):
                      stem=row.get('features',{}).get('stem',{})
                      if stem.get('status') != 'verified':
                          print('FAILED_STEM',path.parent.name,row.get('source_id'),
                                row.get('voice'),row.get('spelling'),
                                json.dumps(stem)[:2500])
              except Exception as exc:
                  print('DIAGNOSTIC',path,exc)
          for path in list(root.rglob('report.json'))[:10]:
              try:
                  report=json.loads(path.read_text())
                  for frame in report.get('frames',[]):
                      print('FINGER_FRAME',path.parent.name,frame['file'],
                            'gap',frame.get('gap'),'labels',len(frame.get('labels',[])),
                            'issues',frame.get('placement_issues'))
              except Exception as exc:
                  print('DIAGNOSTIC',path,exc)
          PY
