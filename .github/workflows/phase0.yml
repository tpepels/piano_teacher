name: Phase 0 smoke
on:
  push:
    branches: [main]
  pull_request:

jobs:
  arch-linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel pkgconf alsa-lib git python python-pip godot cairo pango
      - uses: actions/checkout@v4
      - name: Install application
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[godot,test]'
      - name: Run Python and Godot validation
        run: |
          .venv/bin/python -m pytest -q
          ./scripts/check_godot.sh
      - name: Real rendering and HTTP integration
        run: .venv/bin/python scripts/smoke_phase0.py
      - name: Verify generated exercise engraving and PNGs
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from smoke_phase0 import make_fixture
          make_fixture(Path('/tmp/piano-generated-fixture.mid'))
          PY
          .venv/bin/python scripts/check_generated_lesson.py /tmp/piano-generated-fixture.mid
      - name: Boot Godot UI against a real local backend
        run: .venv/bin/python scripts/smoke_godot.py
      - name: Generated lesson end-to-end Godot rehearsal
        run: .venv/bin/python scripts/smoke_adaptive_godot.py
