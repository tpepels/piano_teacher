name: Piano Teacher integration
on:
  push:
    branches: [main]
  pull_request:

jobs:
  arch-linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed base-devel pkgconf alsa-lib git python python-pip godot cairo pango fluidsynth soundfont-fluid
      - uses: actions/checkout@v4
      - name: Install application
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[godot,test]'
      - name: Run Python and Godot validation
        run: |
          .venv/bin/python -m pytest -q
          ./scripts/check_godot.sh
      - name: Compare user's seven MIDI files with original Verovio engravings
        run: .venv/bin/python scripts/check_user_midi_visual_regression.py --out /tmp/piano-user-midi-visual
      - name: Upload real MIDI visual comparison images and pixel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-verovio-vs-godot-score-strip
          path: /tmp/piano-user-midi-visual
          if-no-files-found: warn
          retention-days: 14
      - name: Real practice UI with the three reported MIDI files
        run: |
          .venv/bin/python scripts/smoke_godot.py --file 'midi/Ala_–_Joep_Beving.midi'
          .venv/bin/python scripts/smoke_godot.py --file 'midi/Bill_Evans_on_Autunm_Leaves_From_the_Album_Portrait_in_Jazz.midi'
          .venv/bin/python scripts/smoke_godot.py --file 'midi/Chopin_-_Nocturne_Op_9_No_2_(E_Flat_Major).midi'
      - name: Audit real score scrolling velocity
        run: .venv/bin/python scripts/audit_scroll_velocity.py
      - name: Real rendering and HTTP integration
        run: .venv/bin/python scripts/smoke_phase0.py
      - name: Verify generated exercise engraving and PNGs
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from smoke_phase0 import make_fixture
          make_fixture(Path('/tmp/piano-generated-fixture.mid'))
          PY
          .venv/bin/python scripts/check_generated_lesson.py /tmp/piano-generated-fixture.mid
      - name: Phase 6 real library pipeline through Godot
        run: |
          .venv/bin/python scripts/verify_library_pipeline.py \
            --music-dir tests/fixtures/musical_fidelity \
            --limit 1 --timeout 180 --godot \
            --output /tmp/piano-phase6-diagnostic
      - name: Upload Phase 6 failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-library-diagnostic
          path: /tmp/piano-phase6-diagnostic
          if-no-files-found: ignore
      - name: Boot Godot UI against a real local backend
        run: .venv/bin/python scripts/smoke_godot.py
      - name: Generated lesson end-to-end Godot rehearsal
        run: .venv/bin/python scripts/smoke_adaptive_godot.py

  desktop-screenshots:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 10
    steps:
      - name: Install graphical test dependencies
        run: pacman -Syu --noconfirm --needed base-devel pkgconf alsa-lib git python python-pip godot cairo pango fluidsynth soundfont-fluid xorg-server-xvfb xorg-xauth mesa
      - uses: actions/checkout@v4
      - name: Install application
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[godot,test]'
      - name: Capture actual practice windows for user MIDI
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            .venv/bin/python scripts/check_user_midi_desktop.py \
            --out /tmp/piano-midi-desktop
      - name: Exercise guided lessons, fullscreen, starting picker, and pause sheet
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            .venv/bin/python scripts/smoke_learning_ui.py \
            --output-dir /tmp/piano-full-learning-ui
      - name: Upload guided learning and pause-screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piano-teacher-learning-and-pause-screens
          path: /tmp/piano-full-learning-ui
          if-no-files-found: warn
          retention-days: 14
      - name: Prove lossless Phase 1 Verovio layout on real Chopin MIDI
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          PIANO_TEACHER_EXACT_VEROVIO_GRID: "1"
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            .venv/bin/python scripts/check_user_midi_desktop.py \
            --only Chopin --require-exact-ink-grid \
            --out /tmp/piano-phase1-exact-grid
      - name: Upload Phase 1 experimental score frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-chopin-original-verovio-ink
          path: /tmp/piano-phase1-exact-grid
          if-no-files-found: warn
          retention-days: 14
      - name: Exercise the original native Godot score on real Joep Beving MIDI
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            .venv/bin/python scripts/check_user_midi_desktop.py \
            --native --only Ala --out /tmp/piano-native-desktop
      - name: Verify native Chopin pickup meter geometry with real Godot pixels
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            .venv/bin/python scripts/check_user_midi_desktop.py \
            --native --only Chopin --out /tmp/piano-native-chopin
      - name: Upload native Chopin pickup engraving evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-chopin-pickup-meter-captures
          path: /tmp/piano-native-chopin
          if-no-files-found: warn
          retention-days: 14
      - name: Upload native Godot notation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-godot-ala-rhythm-captures
          path: /tmp/piano-native-desktop
          if-no-files-found: warn
          retention-days: 14
      - name: Upload rendered Godot desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-midi-godot-practice-screenshots
          path: /tmp/piano-midi-desktop
          if-no-files-found: warn
          retention-days: 14
