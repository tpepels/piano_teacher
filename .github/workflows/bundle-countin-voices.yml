name: Bundle public-domain count-in voices
on:
  push:
    paths:
      - .github/workflows/bundle-countin-voices.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and validate Wikimedia Commons voice samples
        run: |
          python3 scripts/fetch_countin_voices.py
          python3 scripts/fetch_countin_voices.py --verify
          for file in godot/assets/countin/{ichi,ni,san,shi}.ogg; do
            test -s "$file"
            file "$file" | grep -qi 'ogg'
          done
      - name: Commit the real voice files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f godot/assets/countin/ichi.ogg
          git add -f godot/assets/countin/ni.ogg
          git add -f godot/assets/countin/san.ogg
          git add -f godot/assets/countin/shi.ogg
          if ! git diff --cached --quiet; then
            git commit -m "Bundle four public-domain Japanese spoken count-in clips"
            git push origin HEAD:main
          fi
