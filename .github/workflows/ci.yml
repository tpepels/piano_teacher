name: Tests

# Core verifies every main commit. Full embedded/package verification remains manual.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Verification scope"
        required: true
        type: choice
        options:
          - core
          - full
        default: core

permissions:
  contents: read

concurrency:
  # Cancel superseded core runs; retain separately requested full runs.
  group: tests-${{ github.ref }}-${{ inputs.suite || 'core' }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Install pinned quality tools
        run: |
          python -m pip install -r requirements-quality.txt
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Test quality gate
        run: python -m pytest --noconftest -q tests/test_quality_gate.py
      - name: Test native asset mailbox
        run: |
          g++ -std=c++17 -pthread -Wall -Wextra -Werror -I native/src \
            tests/native/asset_mailbox.cpp -o "$RUNNER_TEMP/asset-mailbox-test"
          "$RUNNER_TEMP/asset-mailbox-test"
      - name: Enforce code quality
        run: python scripts/quality_gate.py

  tests:
    runs-on: ubuntu-24.04
    # Player journeys request real model-and-layout bundles under coverage.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[godot,test]' numpy
      - name: Python behavior tests
        env:
          PYTHON: python
        run: bash scripts/test.sh --python-only --coverage
      - name: Publish informational Python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: ignore

  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies and Godot 4.7.2
        id: install
        run: |
          python -m pip install -e '.[godot,test]' numpy
          curl --fail --location --silent --show-error --retry 2 --max-time 65 \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          sudo install -m 755 "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot
      - name: Godot syntax
        run: bash scripts/check-godot-syntax.sh
      - name: Godot player behavior
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PYTHON: python
        run: bash scripts/test-godot-behavior.sh

  fingering:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[godot,test]'
      - run: python -m pytest -q tests/test_fingering.py

  native-production:
    # Run only when the user explicitly selects the full suite.
    if: ${{ inputs.suite == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Prepare exact CPython runtime, compiler, and Godot
        run: |
          # Python 3.14 compiles python-rtmidi from source until a matching
          # wheel exists. The ALSA and JACK headers are build prerequisites,
          # not packaged/runtime dependencies.
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev pkg-config cmake xvfb xauth libgl1-mesa-dri
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -c scripts/release/binary-constraints.txt -e '.[godot,test]' scons
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          sudo install -m 755 "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot
      - name: Verify embedded runtime and assembled standalone package
        env:
          PIANO_PYTHON: ${{ github.workspace }}/.venv/bin/python
          GODOT_BIN: /usr/local/bin/godot
        run: bash scripts/verify-embedded-production-local.sh
      - name: Verify rendered visual continuity
        env:
          PIANO_PYTHON: ${{ github.workspace }}/.venv/bin/python
          GODOT_BIN: /usr/local/bin/godot
          PIANO_VISUAL_RESULTS: ${{ runner.temp }}/visual-continuity
        run: bash scripts/verify-embedded-production-local.sh --visual-only
      - name: Preserve visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rendered-visual-continuity
          path: ${{ runner.temp }}/visual-continuity
          if-no-files-found: ignore

  report-core:
    if: ${{ always() }}
    needs: [tests, godot, fingering, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      # Publish exact-SHA status results independently of the Actions
      # checks API. No token with write permission is given to test jobs.
      - name: Report verification results
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_RESULT: ${{ needs.tests.result }}
          GODOT_RESULT: ${{ needs.godot.result }}
          FINGERING_RESULT: ${{ needs.fingering.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          set -Eeuo pipefail
          report() {
            local context="$1" result="$2" state
            case "$result" in
              success) state=success ;;
              failure) state=failure ;;
              *) state=error ;;
            esac
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" -f context="piano-teacher/$context" \
              -f description="$context: $result" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          }
          report python "$PYTHON_RESULT"
          report godot "$GODOT_RESULT"
          report fingering "$FINGERING_RESULT"
          report quality "$QUALITY_RESULT"
